[package]
name = "gensolid-wasm"
description = "WebAssembly bindings of the Gensolid kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
smlib = ["dep:gensolid", "dep:gensolid-core", "dep:gensolid-math", "dep:gensolid-geom"]
# Validation exports are excluded from production packages.
smlib-validation = ["smlib"]

[dependencies]
gensolid = { package = "gensolid-ffi", path = "../../crates/gensolid-ffi", version = "0.1.0", features = ["smlib"], optional = true }
gensolid-core = { workspace = true, optional = true }
gensolid-math = { workspace = true, optional = true }
gensolid-geom = { workspace = true, optional = true }
gensolid-api.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
